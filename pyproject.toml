[project]
name = "travel-recommender"
version = "1.0.0"
description = "Hybrid travel recommender for Indian destinations: FastAPI + SQLAlchemy + NumPy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic
