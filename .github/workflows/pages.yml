# Trains the model, gates it against the live one, and publishes the web app to GitHub Pages.
# Runs on every push to main, nightly, and on demand.
name: Train and deploy demo

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * *"  # 20:17 UTC = 01:47 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Download the live model (baseline for the publish gate)
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/model/model.json" -o live-model.json || echo "no live model yet"
      - name: Train, evaluate and gate
        run: python -m recsys.train --export-web web/model --baseline live-model.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
